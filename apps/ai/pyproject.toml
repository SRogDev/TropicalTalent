[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# =============================================================================
# TropicalTalent AI services — uv is the ONLY package manager for this project.
# Single source of truth: `uv lock` / `uv sync` from this file.
# requirements.txt / requirements-dev.txt were deleted in the uv migration.
#
# LangChain version decision (2026-11-11):
#   The old requirements.txt (production) pinned LangChain 0.3.x while
#   requirements-dev.txt pinned LangChain 1.2.x — a prod/dev drift that meant
#   dev never tested what prod ran. This file takes the PRODUCTION 0.3.x line
#   as canonical (langchain 0.3.25, langchain-core 0.3.65,
#   langchain-community 0.3.24, langchain-text-splitters 0.3.8,
#   langchain-google-genai 2.1.4). A move to LangChain 1.x is a separate,
#   deliberate upgrade decision — do not drift the two lines apart again.
#
# Added vs. the old requirements.txt:
#   - redis: imported by app/dependencies/rate_limiting.py,
#     app/core/search_cache.py and app/core/user_vector_cache.py but never
#     listed as a dependency. Added here (was a latent ImportError in prod).
#   - httpx (dev group): tests/conftest.py imports httpx (TestClient) and the
#     old pyproject listed it under dev optional-dependencies.
# =============================================================================

[project]
name = "tropical-talent-ai"
version = "0.1.0"
description = "TropicalTalent AI services — semantic search, recommendations, and profile vectorization for talent connecting Cuba with the world"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core API framework
    "fastapi==0.129.0",
    "uvicorn[standard]==0.40.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "python-multipart==0.0.22",
    # Production server
    "gunicorn==25.1.0",
    # Database and vector store
    "pinecone==7.3.0",
    "langchain-pinecone==0.2.13",
    # LangChain stack (production 0.3.x line — see header note)
    "langchain==0.3.25",
    "langchain-core==0.3.65",
    "langchain-community==0.3.24",
    "langchain-text-splitters==0.3.8",
    "langchain-google-genai==2.1.4",
    "langgraph>=0.3.0",
    "langgraph-checkpoint-redis>=0.0.4",
    # YouTube transcript (replaces Gemini video processing)
    "youtube-transcript-api>=0.6.0",
    # QStash — durable message queue for vectorize webhook (signature verification)
    "qstash>=2.0.0",
    # Database clients
    "supabase==2.28.0",
    "postgrest==2.28.0",
    "storage3==2.28.0",
    # Configuration management
    "python-dotenv==1.2.1",
    # JWT and authentication
    "python-jose[cryptography]==3.3.0",
    # Logging and monitoring (production)
    "structlog==25.5.0",
    "sentry-sdk==2.52.0",
    # PDF processing
    "pymupdf==1.27.1",
    # Utilities
    "email-validator==2.3.0",
    "numpy==2.4.2",
    # Redis — used by rate limiting and caches (was missing from requirements.txt)
    "redis>=5.0",
]

[dependency-groups]
dev = [
    # Testing framework
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    # Code quality tools
    "pylint==4.0.4",
    "black==26.1.0",
    "isort==7.0.0",
    "mypy==1.19.1",
    # Git hooks
    "pre-commit==4.5.1",
    # Type hints for external libraries
    "types-requests==2.32.4.20260107",
    # HTTP client used by the test suite (TestClient)
    "httpx>=0.25.2",
]

[tool.uv]
# This repo is a deployable application, not an installable library:
# uv manages the venv + dependencies only, it never builds/installs
# the `tropical-talent-ai` package itself (setuptools auto-discovery would
# fail: top-level `app/` and `tests/` look like two packages).
package = false

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.pylint.messages_control]
disable = [
    "too-few-public-methods",
    "missing-module-docstring",
]

[tool.pylint.format]
max-line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Mirror of pytest.ini (pytest.ini wins when both exist). The project is not
# installed as a package, so the root must be on sys.path for `import app`.
pythonpath = ["."]
