[pytest]
# Pytest configuration for TropicalTalent AI

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# The project is not installed as a package ([tool.uv] package = false),
# so the project root must be on sys.path for `import app...` to work.
pythonpath = .

# Markers (custom test categories)
markers =
    unit: Unit tests for individual components
    integration: Integration tests for API endpoints
    slow: Slow-running tests (>1 second)
    auth: Authentication-related tests

# Coverage settings
addopts =
    --strict-markers
    --tb=short
    --cov-report=term-missing
    --cov-report=html
    --cov-branch
    -ra

# Asyncio configuration
asyncio_mode = auto

# Test output
console_output_style = progress

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning

# Minimum Python version
minversion = 3.10
